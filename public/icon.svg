<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="lensGlass" x1="48" y1="42" x2="162" y2="156" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.92" />
      <stop offset="48%" stop-color="#38BDF8" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.92" />
    </linearGradient>
    <linearGradient id="rimMetallic" x1="36" y1="36" x2="176" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="handleGrad" x1="156" y1="156" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <!-- Handle outer high-contrast stroke -->
  <path d="M161 161 L217 217" stroke="#F8FAFC" stroke-width="34" stroke-linecap="round" opacity="0.9" />
  <path d="M161 161 L217 217" stroke="url(#handleGrad)" stroke-width="26" stroke-linecap="round" />
  <path d="M169 169 L211 211" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  <!-- Outer dark halo for visibility on light taskbars -->
  <circle cx="106" cy="106" r="78" fill="#0F172A" />
  <!-- Bright metallic rim for visibility on dark taskbars -->
  <circle cx="106" cy="106" r="73" fill="url(#rimMetallic)" />
  <!-- Inner bezel shadow -->
  <circle cx="106" cy="106" r="61" fill="#0C4A6E" />
  <!-- Translucent cyan/blue glass lens -->
  <circle cx="106" cy="106" r="57" fill="url(#lensGlass)" />
  <!-- Specular glass highlight -->
  <path d="M68 88 C74 68 92 58 114 60" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.72" />
  <circle cx="130" cy="69" r="5" fill="#FFFFFF" opacity="0.68" />
</svg>
