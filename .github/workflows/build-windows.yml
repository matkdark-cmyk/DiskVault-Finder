name: Build Windows x64 (Instalador Nativo)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar como Release oficial en GitHub (para actualizar desde la app)'
        type: boolean
        default: true
      release_tag:
        description: 'Etiqueta de versión opcional (ejemplo: v1.0.0; vacío usa la de tauri.conf.json)'
        type: string
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Compilar DiskVault Finder Nativo (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Rust estable (Windows x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Caché de dependencias Rust (Cargo)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Instalar dependencias de frontend
        shell: pwsh
        run: |
          if (Test-Path "package-lock.json") {
            npm ci
          } else {
            npm install
          }

      - name: Compilar instalador nativo Windows x64 (.exe)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\build-releases.ps1

      - name: Determinar etiqueta de versión
        id: version
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $conf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $pkgVersion = if ($conf.version) { $conf.version } else { "1.0.0" }

          if ($env:EVENT_NAME -eq "push" -and $env:REF_NAME) {
            $tag = $env:REF_NAME
          } elseif ($env:INPUT_TAG -and $env:INPUT_TAG.Trim() -ne "") {
            $tag = $env:INPUT_TAG.Trim()
          } else {
            $tag = "v$pkgVersion"
          }

          if ($tag -notmatch '^v?[0-9A-Za-z._-]+$') {
            throw "La etiqueta '$tag' contiene caracteres no válidos."
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Etiqueta seleccionada: $tag"

      - name: Subir instalador nativo como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DiskVault-Finder-Windows-x64
          path: |
            release/*-setup.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publicar Release en GitHub (actualizable desde la app)
        if: github.event_name == 'push' || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DiskVault Finder ${{ steps.version.outputs.tag }} (Windows x64)
          generate_release_notes: true
          files: |
            release/*-setup.exe
            release/SHA256SUMS.txt
